[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corridas-brasil-ingestion"
version = "0.1.0"
description = "Ingestão rastreável de calendários de corridas do Brasil"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "rapidfuzz>=3.9,<4",
  "python-dateutil>=2.9,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.47,<2"]
dev = ["pytest>=8,<9", "ruff>=0.7,<1"]

[project.scripts]
corridas-ingest = "race_ingestion.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
